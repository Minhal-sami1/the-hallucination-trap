[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-trap-api"
version = "0.1.0"
description = "A live audit for fabricated legal citations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "fastembed==0.7.4",
  "huggingface-hub==1.27.0",
  "httpx==0.28.1",
  "numpy==2.5.2",
  "onnxruntime==1.28.0",
  "openai==1.109.1",
  "orjson==3.11.9",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pypdf==6.15.0",
  "sse-starlette==3.4.8",
  "sqlalchemy==2.0.52",
  "tenacity==9.1.4",
  "tokenizers==0.23.1",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
"api/app/main.py" = ["B008"]
"scripts/*.py" = ["BLE001", "TRY004"]
